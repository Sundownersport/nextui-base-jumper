name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pak zip
        run: zip -r Base.Jumper.pak.zip launch.sh bin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .version pak.json)
          jq -r --arg t "$TAG" '.changelog[$t] // empty' pak.json > notes.txt
          gh release create "$TAG" Base.Jumper.pak.zip --title "$TAG" --notes-file notes.txt --target "$GITHUB_SHA"
